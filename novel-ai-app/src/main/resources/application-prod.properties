# Application
spring.application.name=Novel_AI

# Server - 绑定所有网卡，允许外部访问
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/novel

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/novel_ai_forum?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=novel
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.path=C:/wwwroot/0209cc.top/chat_ui/springboot/uploads/images/
app.upload.url-prefix=/novel/files/images/
app.upload.base-url=http://111.229.83.82:8080

# JWT Configuration
jwt.secret=28482B4D6251655368566D597133743677397A24432646294A404E635266556A
jwt.expiration-ms=86400000

# 404 错误抛出异常
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging - 生产环境减少日志
logging.level.com.cc.novel_ai=INFO
logging.level.org.hibernate.SQL=WARN
