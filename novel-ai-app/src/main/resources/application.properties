# Application
spring.application.name=Novel_AI

# Server
server.port=8080
server.servlet.context-path=/novel

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/novel_ai_forum?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=novel
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.path=./uploads/images/
app.upload.url-prefix=/novel/files/images/
app.upload.base-url=http://localhost:8080

# JWT Configuration
jwt.secret=28482B4D6251655368566D597133743677397A24432646294A404E635266556A
jwt.expiration-ms=86400000

# 404 错误抛出异常，由 GlobalExceptionHandler 处理
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging
logging.level.com.cc.novel_ai=DEBUG
logging.level.org.hibernate.SQL=DEBUG
